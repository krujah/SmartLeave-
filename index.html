  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171f; --card:#1c212d; --ink:#eef1f7; --muted:#9aa3b5;
      --brand:#6f9ceb; --brand-dark:#8fb1ef; --accent:#e07a6f; --ok:#5cc27a; --warn:#e0b25f;
      --border:#2a3040;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171f; --card:#1c212d; --ink:#eef1f7; --muted:#9aa3b5;
    --brand:#6f9ceb; --brand-dark:#8fb1ef; --accent:#e07a6f; --ok:#5cc27a; --warn:#e0b25f;
    --border:#2a3040;
  }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); position:relative;
    font-family:'Sarabun', 'TH Sarabun New', 'Leelawadee UI', Tahoma, sans-serif;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image: linear-gradient(rgba(255,255,255,.84), rgba(244,246,251,.90)), var(--bg-photo);
    background-size:cover; background-position:center top; background-repeat:no-repeat;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body::before{
      background-image: linear-gradient(rgba(20,23,31,.86), rgba(20,23,31,.92)), var(--bg-photo);
    }
  }
  :root[data-theme="dark"] body::before{
    background-image: linear-gradient(rgba(20,23,31,.86), rgba(20,23,31,.92)), var(--bg-photo);
  }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .btn{ font-weight:600; border-radius:10px; padding:.6rem 1.1rem; transition:.15s; cursor:pointer; border:1px solid transparent; }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-secondary{ background:transparent; color:var(--brand); border-color:var(--brand); }
  .btn-secondary:hover{ background:var(--brand); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--muted); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  input, select, textarea{
    background:var(--card); color:var(--ink); border:1px solid var(--border);
    border-radius:10px; padding:.55rem .7rem; width:100%; font-family:inherit; font-size:1rem;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  label{ font-size:.85rem; color:var(--muted); font-weight:600; display:block; margin-bottom:.25rem; }
  .step-pill{ display:flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:999px; font-weight:700; font-size:.9rem; flex:none; }
  .step-active .step-pill{ background:var(--brand); color:#fff; }
  .step-done .step-pill{ background:var(--ok); color:#fff; }
  .step-todo .step-pill{ background:var(--border); color:var(--muted); }
  .step-label{ font-size:.8rem; color:var(--muted); }
  .step-active .step-label{ color:var(--ink); font-weight:700; }
  table{ border-collapse:collapse; width:100%; }
  th,td{ border:1px solid var(--border); padding:.5rem .6rem; font-size:.9rem; }
  th{ background:var(--brand); color:#fff; font-weight:700; }
  .badge{ display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.75rem; font-weight:700; }
  .badge-free{ background:rgba(26,127,55,.12); color:var(--ok); }
  .badge-busy{ background:rgba(192,57,43,.12); color:var(--accent); }
  .fade-in{ animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .scrollx{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  ::selection{ background:var(--brand); color:#fff; }
</style>

function uid(){ return 'lv_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
/* All date math below uses Date.UTC exclusively (never local-time Date parsing).
   Parsing "YYYY-MM-DDT00:00:00" as local time + toISOString() (UTC) used to shift
   dates backward in positive-UTC-offset timezones (e.g. Bangkok, UTC+7), which made
   addDays() return the SAME calendar day forever — that was the "180 periods" bug. */
function toUTCDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d));
}
function fmtDate(iso){
  if(!iso) return "";
  const d = toUTCDate(iso);
  const days=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
  return d.getUTCDate()+"/"+(d.getUTCMonth()+1)+"/"+(d.getUTCFullYear()+543)+" ("+days[d.getUTCDay()]+")";
}
function thaiDay(iso){
  return DAY_NAMES[toUTCDate(iso).getUTCDay()];
}
function addDays(iso, n){
  const d = toUTCDate(iso);
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function dateRange(fromIso, toIso){
  const out=[]; let cur=fromIso; let guard=0;
  // 31-day safety cap: a school leave should never span more than a month;
  // this also stops any future date-math bug from silently exploding the list.
  while(cur<=toIso && guard<31){ out.push(cur); cur=addDays(cur,1); guard++; }
  return out;
}
const THAI_MONTHS = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function formatThaiLong(isoDateTime){
  const iso = (isoDateTime||"").slice(0,10);
  if(!iso) return {day:"…………",month:"…………………",year:"……………"};
  const d = toUTCDate(iso);
  return { day: d.getUTCDate(), month: THAI_MONTHS[d.getUTCMonth()+1], year: d.getUTCFullYear()+543 };
}
function workingDaysCount(dateFrom, dateTo){
  return dateRange(dateFrom, dateTo).filter(d => thaiDay(d)!=="เสาร์" && thaiDay(d)!=="อาทิตย์").length;
}
/* Sum of days from this teacher's earlier leave records of the SAME leave type
   (used for the "สถิติการลา" — ลามาแล้ว / รวมเป็น — box on the printed form). */
function priorLeaveDays(teacherName, leaveType, excludeId){
  let total = 0;
  for(const l of (state.leaves||[])){
    if(l.id===excludeId) continue;
    if(l.teacherName!==teacherName || l.leaveType!==leaveType) continue;
    total += Math.round((new Date(l.dateTo)-new Date(l.dateFrom))/86400000)+1;
  }
  return total;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* Build the list of {date, day, period, time, subject, class} rows for a leave's date range,
   using ONLY periods where the leaving teacher actually has a class.
   For the two kindergarten homeroom teachers, the substitute is pre-filled with
   their paired kindergarten colleague, per the school's own swap arrangement —
   still editable if a different cover is needed on a given day. Kindergarten
   classes aren't split into subject periods, so each leave day becomes ONE
   whole-day row instead of six per-period rows. */
function buildScheduleRows(teacherName, dateFrom, dateTo){
  const rows = [];
  const days = dateRange(dateFrom, dateTo);
  const defaultSub = KINDERGARTEN_PAIR[teacherName] || "";
  const isKindergarten = !!KINDERGARTEN_CLASS[teacherName];

  if(isKindergarten){
    const kgClass = KINDERGARTEN_CLASS[teacherName];
    for(const iso of days){
      const day = thaiDay(iso);
      if(day === "เสาร์" || day === "อาทิตย์") continue;
      rows.push({
        date: iso, day, period: 0, periodLabel: "ทั้งวัน",
        time: `${PERIOD_TIMES["1"]||""} – ${PERIOD_TIMES["6"]||""}`,
        subject: "ดูแลชั้นเรียน", class: kgClass, substitute: defaultSub
      });
    }
    return rows;
  }

  const sched = SCHEDULE[teacherName] || {};
  for(const iso of days){
    const day = thaiDay(iso);
    if(day === "เสาร์" || day === "อาทิตย์") continue; // skip weekends automatically
    const dayObj = sched[day] || {};
    for(const p of PERIODS){
      const info = dayObj[String(p)];
      if(info){
        rows.push({
          date: iso, day, period: p, periodLabel: `คาบ ${p}`, time: PERIOD_TIMES[String(p)]||"",
          subject: info.subject, class: info.class, substitute: defaultSub
        });
      }
    }
  }
  return rows;
}

/* Who is free / busy for a given date+period (excluding the teacher on leave).
   period === 0 means a whole-day slot (kindergarten): a teacher counts as busy
   if they have ANY class that day, not just one specific period. */
function freeBusyForSlot(day, period, excludeTeacher){
  const busy = new Set();
  for(const t of TEACHERS){
    if(t === excludeTeacher) continue;
    const daySched = SCHEDULE[t] && SCHEDULE[t][day];
    const isBusy = period === 0
      ? !!(daySched && Object.keys(daySched).length > 0)
      : !!(daySched && daySched[String(period)]);
    if(isBusy) busy.add(t);
  }
  return TEACHERS.filter(t=>t!==excludeTeacher).map(t=>({name:t, free: !busy.has(t)}))
                 .sort((a,b)=> (b.free - a.free) || a.name.localeCompare(b.name,'th'));
}

/* ============ backend (Google Apps Script) ============ */
// GET-only API (even for writes) so calling it from a different origin, like
// GitHub Pages, never triggers a CORS preflight — Apps Script web apps don't
// handle preflight OPTIONS requests, so POST+JSON would otherwise just fail silently.
async function gasCall(params){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    console.warn('SCRIPT_URL is not set yet — see README.md');
    return null;
  }
  const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  try{
    const res = await fetch(url);
    return await res.json();
  }catch(e){
    console.warn('gasCall failed', params.action, e);
    return null;
  }
}

async function initDb(){
  // Restore a previously-unlocked admin session on this browser (see checkAdminPin).
  isAdmin = sessionStorage.getItem('isAdmin') === '1';
  await loadLeaves();
  state.loadingDb = false;
  render();
}

async function loadLeaves(){
  const res = await gasCall({ action: 'listLeaves' });
  if(res && res.leaves) state.leaves = res.leaves;
  else state.leaves = state.leaves || []; // keep whatever's in memory if the call failed
}

async function saveLeave(leave){
  const res = await gasCall({ action: 'saveLeave', data: JSON.stringify(leave) });
  if(res && res.ok) return true;
  // memory fallback so the flow still works even if the backend call failed
  const idx = state.leaves.findIndex(l=>l.id===leave.id);
  if(idx>=0) state.leaves[idx]=leave; else state.leaves.unshift(leave);
  return false;
}

async function loadAssignments(leaveId){
  const res = await gasCall({ action: 'getAssignments', leaveId });
  return (res && res.rows) ? res.rows : null;
}

async function saveAssignments(leaveId, rows){
  const res = await gasCall({ action: 'saveAssignments', leaveId, data: JSON.stringify(rows) });
  return !!(res && res.ok);
}

/* Simple PIN gate for the admin-only leave history/statistics view — there's no
   Claude "who's the owner" check outside claude.ai, so the backend compares this
   PIN against the ADMIN_PIN Script Property you set in your own Apps Script
   project (never committed to the public GitHub repo). Not high-security, but
   reasonable for a small internal school tool. */
async function checkAdminPin(pin){
  const res = await gasCall({ action: 'checkAdmin', pin });
  const ok = !!(res && res.isAdmin);
  if(ok){ isAdmin = true; sessionStorage.setItem('isAdmin','1'); }
  return ok;
}
function adminLogout(){
  isAdmin = false;
  sessionStorage.removeItem('isAdmin');
  render();
}

/* ---------- ASSIGN SUBSTITUTES ---------- */
function renderAssign(){
  const leave = state.currentLeave;
  if(!leave) return `<div class="card p-6">ไม่พบข้อมูลใบลา</div>`;
  const rows = state.currentAssignments || [];

  if(rows.length===0){
    return `
    <div class="card p-6 fade-in text-center py-16">
      <p class="text-lg mb-2">🎉 ไม่มีคาบสอนของ ${escapeHtml(leave.teacherName)}</p>
      <p class="text-sm mb-6" style="color:var(--muted)">ในช่วงวันที่ ${fmtDate(leave.dateFrom)} – ${fmtDate(leave.dateTo)} ไม่ต้องจัดครูสอนแทน</p>
      <button data-nav="document" class="btn btn-primary">ไปหน้าเอกสาร →</button>
    </div>`;
  }

  let lastKey = null;
  const trs = rows.map((r, idx)=>{
    const key = r.date;
    const showDate = key !== lastKey;
    lastKey = key;
    const options = freeBusyForSlot(r.day, r.period, leave.teacherName);
    const optHtml = options.map(o=>
      `<option value="${escapeHtml(o.name)}" ${r.substitute===o.name?'selected':''}>${o.free?'🟢':'🔴'} ${escapeHtml(o.name)} ${o.free?'(ว่าง)':'(ไม่ว่าง)'}</option>`
    ).join("");
    return `<tr class="fade-in">
      <td class="whitespace-nowrap font-semibold">${showDate? fmtDate(r.date) : ""}</td>
      <td class="text-center">${r.periodLabel || ('คาบ '+r.period)}</td>
      <td class="whitespace-nowrap text-center">${r.time}</td>
      <td>${escapeHtml(r.subject)}</td>
      <td class="text-center">${escapeHtml(r.class)}</td>
      <td>
        <select data-sub-idx="${idx}" class="text-sm">
          <option value="">-- เลือกครูสอนแทน --</option>
          ${optHtml}
        </select>
      </td>
    </tr>`;
  }).join("");

  const filled = rows.filter(r=>r.substitute).length;

  return `
  <div class="fade-in">
    <div class="card p-5 mb-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold">จัดครูสอนแทน — ${escapeHtml(leave.teacherName)}</h2>
          <p class="text-sm" style="color:var(--muted)">${escapeHtml(leave.leaveType)} · ${fmtDate(leave.dateFrom)}${leave.dateFrom!==leave.dateTo?' – '+fmtDate(leave.dateTo):''} · จัดแล้ว ${filled}/${rows.length} คาบ</p>
        </div>
        <span class="badge ${filled===rows.length?'badge-free':'badge-busy'}">${filled===rows.length? 'ครบทุกคาบ ✓' : 'ยังไม่ครบ'}</span>
      </div>
      <p class="text-xs mt-2" style="color:var(--muted)">🟢 = ครูว่างคาบนั้น · 🔴 = ครูมีคาบสอนอยู่แล้ว (ยังเลือกได้ แต่ควรหลีกเลี่ยง)</p>
    </div>

    <div class="card p-5">
      <div class="scrollx">
        <table>
          <thead><tr><th>วันที่</th><th>คาบ</th><th>เวลา</th><th>วิชา</th><th>ชั้น</th><th>ครูผู้สอนแทน</th></tr></thead>

      </div>
      <div class="flex justify-between items-center mt-5">
        <button data-nav="home" class="btn btn-ghost">← กลับหน้าหลัก</button>
        <button id="saveAssignBtn" class="btn btn-primary">บันทึกและไปหน้าเอกสาร →</button>
      </div>
    </div>
  </div>`;
}

  if(adminPinBtn){
    const pinInput = document.getElementById('adminPinInput');
    const errEl = document.getElementById('adminPinError');
    const trySubmit = async ()=>{
      const pin = pinInput.value.trim();
      if(!pin) return;
      adminPinBtn.disabled = true; adminPinBtn.textContent = 'กำลังตรวจสอบ...';
      const ok = await checkAdminPin(pin);
      if(ok){ render(); }
      else {
        adminPinBtn.disabled = false; adminPinBtn.textContent = 'เข้าสู่โหมดแอดมิน';
        errEl.textContent = 'PIN ไม่ถูกต้อง';
      }
    };
    adminPinBtn.addEventListener('click', trySubmit);
    pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') trySubmit(); });
  }

  root.querySelectorAll('[data-open-leave]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-open-leave');
      const leave = state.leaves.find(l=>l.id===id);
      if(!leave) return;
      state.currentLeaveId = id;
      state.currentLeave = leave;
      state.loadingDb = true; render();
      let rows = await loadAssignments(id);
      if(!rows) rows = buildScheduleRows(leave.teacherName, leave.dateFrom, leave.dateTo);
      state.currentAssignments = rows;
      state.loadingDb = false;
      state.view = "assign";
      render();
    });
  });

  const leaveForm = document.getElementById('leaveForm');
  if(leaveForm){
    const previewBox = document.getElementById('dayPreview');
    const teacherSel = leaveForm.querySelector('[name=teacherName]');
    const fromInput = document.getElementById('dateFromInput');
    const toInput = document.getElementById('dateToInput');
    function updatePreview(){
      const teacher = teacherSel.value;
      const df = fromInput.value, dt = toInput.value;
      if(!df || !dt){ previewBox.innerHTML=""; return; }
      if(dt < df){ previewBox.innerHTML = `<p class="text-sm" style="color:var(--accent)">⚠️ วันสิ้นสุดต้องไม่ก่อนวันเริ่มลา</p>`; return; }
      const days = dateRange(df, dt);
      const weekdays = days.filter(d => thaiDay(d)!=="เสาร์" && thaiDay(d)!=="อาทิตย์");
      let periodCount = 0;
      const isKg = !!KINDERGARTEN_CLASS[teacher];
      if(teacher){
        periodCount = buildScheduleRows(teacher, df, dt).length;
      }
      const listHtml = weekdays.map(d=>`<span class="badge badge-free" style="margin:2px;">${fmtDate(d)}</span>`).join(" ");
      previewBox.innerHTML = `
        <div class="p-3 rounded-lg" style="background:var(--bg);border:1px solid var(--border);">
          <p class="text-sm mb-1"><b>วันลาที่เป็นวันทำการ:</b> ${weekdays.length} วัน ${days.length>weekdays.length? `(ตัดวันหยุดเสาร์-อาทิตย์ออกแล้ว ${days.length-weekdays.length} วัน)`:''}</p>
          <div class="mb-1">${listHtml || '<span class="text-sm" style="color:var(--muted)">-</span>'}</div>
          ${teacher ? `<p class="text-sm">${isKg ? `จำนวนวันที่ต้องจัดครูสอนแทน (นับเต็มวัน): <b>${periodCount}</b> วัน` : `คาบสอนที่ต้องจัดสอนแทนรวม: <b>${periodCount}</b> คาบ`}</p>` : `<p class="text-xs" style="color:var(--muted)">เลือกชื่อครูเพื่อดูจำนวนคาบสอนที่ต้องจัดแทน</p>`}
        </div>`;
    }
    teacherSel.addEventListener('change', updatePreview);
    fromInput.addEventListener('change', updatePreview);
    toInput.addEventListener('change', updatePreview);
    updatePreview();

    leaveForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(leaveForm);
      const dateFrom = fd.get('dateFrom'), dateTo = fd.get('dateTo');
      if(dateTo < dateFrom){ alert('วันที่สิ้นสุดต้องไม่ก่อนวันเริ่มลา'); return; }
      const leave = {
        id: uid(),
        teacherName: fd.get('teacherName'),
        position: fd.get('position') || 'ครู',
        leaveType: fd.get('leaveType'),
        dateFrom, dateTo,
        reason: fd.get('reason') || '',
        contactPlace: fd.get('contactPlace') || '',
        contactPhone: fd.get('contactPhone') || '',
        createdAt: new Date().toISOString(),
      };
      if(!leave.teacherName || !leave.leaveType){ alert('กรุณากรอกข้อมูลให้ครบ'); return; }
      const btn = leaveForm.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      await saveLeave(leave);
      await loadLeaves();
      state.currentLeaveId = leave.id;
      state.currentLeave = leave;
      state.currentAssignments = buildScheduleRows(leave.teacherName, leave.dateFrom, leave.dateTo);
      state.view = "assign";
      render();
    });
  }

  root.querySelectorAll('[data-sub-idx]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const idx = parseInt(el.getAttribute('data-sub-idx'),10);
      state.currentAssignments[idx].substitute = el.value;
      render();
    });
  });

  const saveAssignBtn = document.getElementById('saveAssignBtn');
  if(saveAssignBtn){
    saveAssignBtn.addEventListener('click', async ()=>{
      saveAssignBtn.disabled = true; saveAssignBtn.textContent = 'กำลังบันทึก...';
      await saveAssignments(state.currentLeaveId, state.currentAssignments);
      state.view = "document";
      render();
    });
  }

  const printBtn = document.getElementById('printBtn');
  if(printBtn){
    printBtn.addEventListener('click', ()=>{
      const w = window.open('', '_blank');
      const content = document.getElementById('printArea').outerHTML;
      w.document.write('<html><head><meta charset="utf-8"><title>เอกสาร</title>' +
        '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">' +
        '<style>body{margin:0;} @page{size:A4;margin:20mm;}</style></head><body>'+content+'</body></html>');
      w.document.close();
      setTimeout(()=>{ w.focus(); w.print(); }, 400);
    });
  }

  const pdfBtn = document.getElementById('pdfBtn');
  if(pdfBtn){
    pdfBtn.addEventListener('click', async ()=>{
      pdfBtn.disabled = true; const orig = pdfBtn.textContent; pdfBtn.textContent = 'กำลังสร้าง PDF...';
      try{
        // A4 page geometry, shared by capture and placement so the pixel width we
        // render at always matches the mm width we place it into — mismatching these
        // two is what silently shrank the text before (rendered for a 210mm-wide page,
        // then squeezed into a 170mm content area after the 20mm margins).
        const PAGE_W_MM = 210, PAGE_H_MM = 297, MARGIN_MM = 20;
        const CONTENT_W_MM = PAGE_W_MM - MARGIN_MM*2;
        const CONTENT_H_MM = PAGE_H_MM - MARGIN_MM*2;
        const PX_PER_MM = 794/210; // ~96dpi reference
        const CAPTURE_W_PX = Math.round(CONTENT_W_MM * PX_PER_MM);

        async function captureEl(el){
          const clone = el.cloneNode(true);
          clone.style.maxHeight = 'none';
          clone.style.width = CAPTURE_W_PX+'px';
          clone.style.maxWidth = CAPTURE_W_PX+'px';
          const wrapper = document.createElement('div');
          wrapper.style.position='fixed'; wrapper.style.left='-9999px'; wrapper.style.top='0';
          wrapper.style.width=CAPTURE_W_PX+'px';
          wrapper.appendChild(clone);
          document.body.appendChild(wrapper);
          // Wait for the web font (Sarabun) to actually finish loading before snapshotting —
          // otherwise html2canvas can capture a frame that's still rendered in the browser's
          // fallback font, which is why the exported PDF sometimes looked like the wrong font
          // even though the page itself displays correctly once the font arrives.
          try{ await document.fonts.ready; }catch(e){}
          const canvas = await html2canvas(clone, { scale:2, useCORS:true, backgroundColor:'#ffffff' });
          document.body.removeChild(wrapper);
          return canvas;
        }
        // Each logical document (ใบลา, บันทึกจัดสอนแทน) starts on its own fresh PDF page —
        // captured and paginated independently so one never bleeds into the other's page.
        function addCanvasAsPages(pdf, canvas, isFirstOverall){
          const imgW = CONTENT_W_MM;
          const imgH = canvas.height * imgW / canvas.width;
          const totalPages = Math.max(1, Math.ceil(imgH / CONTENT_H_MM));
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          for(let p=0; p<totalPages; p++){
            if(!(isFirstOverall && p===0)) pdf.addPage();
            const yPos = MARGIN_MM - p*CONTENT_H_MM;
            pdf.addImage(imgData, 'JPEG', MARGIN_MM, yPos, imgW, imgH);
          }
        }

        const page1El = document.getElementById('printPage1');
        const page2El = document.getElementById('printPage2');
        const canvas1 = await captureEl(page1El);
        const canvas2 = page2El ? await captureEl(page2El) : null;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p','mm','a4');
        addCanvasAsPages(pdf, canvas1, true);
        if(canvas2) addCanvasAsPages(pdf, canvas2, false);

        const blob = pdf.output('blob');
        const filename = `ใบลาและจัดสอนแทน_${(state.currentLeave.teacherName||'').replace(/\s+/g,'')}_${state.currentLeave.dateFrom}.pdf`;

        // Plain browser download — works the same on GitHub Pages as anywhere else,
        // no platform-specific API needed.
        fallbackDownload(blob, filename);
        pdfBtn.textContent = '✅ ดาวน์โหลดแล้ว';
      }catch(err){
        console.error(err);
        alert('สร้าง PDF ไม่สำเร็จ ลองใช้ปุ่ม "พิมพ์" แทน');
        pdfBtn.textContent = orig;
      }
      setTimeout(()=>{ pdfBtn.disabled=false; pdfBtn.textContent = orig; }, 2500);
    });
  }
}

function fallbackDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

/* ============ boot ============ */
initDb();
</script>
</body>
